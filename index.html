            </label>
            <label class="notify-option">
              <input type="checkbox" name="notify" value="email">
              <span class="notify-option__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg></span>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('SW registered');
            // Проверявай за нова версия при всяко отваряне (иначе PWA може
            // да върти седмици стар кеш и да крие нови събития/поправки)
            reg.update();
            setInterval(() => reg.update(), 60 * 60 * 1000);
          })
          .catch(err => console.log('SW registration failed:', err));
      });
      // Когато нов SW поеме контрола — презареди веднъж за свежите файлове
      let swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swReloaded) return;
        swReloaded = true;
        window.location.reload();
      });
    }
  </script>
